[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contaminant-detector"
version = "0.1.0"
description = "A pipeline for running sompy in Docker and analyzing the resulting stats."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sophie Paul", email = "sophie.paul3@nhs.net" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "dxpy==0.405.0",
    "docker==7.1.0",
    "pandas==3.0.1",
    "matplotlib==3.10.8",
    "seaborn==0.13.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "types-docker",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
